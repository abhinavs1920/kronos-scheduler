apiVersion: apps/v1
kind: Deployment
metadata:
  name: kronos-kube-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      component: kronos-kube-scheduler
  template:
    metadata:
      labels:
        component: kronos-kube-scheduler
    spec:
      serviceAccountName: kronos-scheduler  # ✅ Add this line
      containers:
      - name: kube-scheduler
        image: registry.k8s.io/kube-scheduler:v1.32.2
        command:
        - kube-scheduler
        - --config=/etc/kubernetes/scheduler-config.yaml
        volumeMounts:
        - name: scheduler-config
          mountPath: /etc/kubernetes
      volumes:
      - name: scheduler-config
        configMap:
          name: scheduler-config
