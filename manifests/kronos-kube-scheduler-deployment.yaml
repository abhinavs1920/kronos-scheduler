apiVersion: apps/v1
kind: Deployment
metadata:
  name: kronos-kube-scheduler
  namespace: kube-system
  labels:
    app: kronos-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kronos-scheduler
  template:
    metadata:
      labels:
        app: kronos-scheduler
    spec:
      serviceAccountName: kronos-scheduler
      schedulerName: kronos-scheduler
      priorityClassName: system-cluster-critical

      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoSchedule

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
      - name: kube-scheduler
        image: abhinavs1920/kronos-scheduler:latest
        imagePullPolicy: Always

        args:
        - --config=/etc/kubernetes/scheduler-config.yaml
        - --authentication-kubeconfig=/etc/kubernetes/scheduler.conf
        - --authorization-kubeconfig=/etc/kubernetes/scheduler.conf
        - --v=5
        - --leader-elect=true

        ports:
        - name: metrics
          containerPort: 10259
          protocol: TCP
        - name: healthz
          containerPort: 10251
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
          initialDelaySeconds: 15
          timeoutSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
          initialDelaySeconds: 5
          timeoutSeconds: 10

        volumeMounts:
        - name: scheduler-projected
          mountPath: /etc/kubernetes

        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0

      volumes:
      - name: scheduler-projected
        projected:
          sources:
          - configMap:
              name: scheduler-config
              items:
              - key: scheduler-config.yaml
                path: scheduler-config.yaml
          - secret:
              name: scheduler-kubeconfig
              items:
              - key: scheduler.conf
                path: scheduler.conf
          defaultMode: 420
